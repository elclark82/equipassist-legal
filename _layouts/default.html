<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173b57">
    <meta name="robots" content="index, follow">
    <title>{% if page.title %}{{ page.title }} | {% endif %}EquipAssist</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="assets/legal.css">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="EquipAssist legal home">
          <span class="brand-mark" aria-hidden="true">EA</span>
          <span>
            <strong>EquipAssist</strong>
            <small>Legal &amp; Policies</small>
          </span>
        </a>
        <nav class="site-nav" aria-label="Legal documents">
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="data-deletion.html">Data deletion</a>
          <a href="borrowing-terms.html">Borrowing</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="document-shell">
      <article class="legal-document">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div>
        <strong>EquipAssist</strong>
        <span>Operated by Earl Clark in North Carolina, USA</span>
      </div>
      <a href="mailto:support@equipassist.net">support@equipassist.net</a>
    </footer>
  </body>

</html>
